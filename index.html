<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Element Lab: Periodic Table Challenge</title>
<style>
:root{--ink:#172033;--mute:#4d5b75;--bg:#e8eef3;--card:#fff;--line:#c4d0db;--accent:#0b6b78;--good:#17773f;--bad:#b3261e;
--a:#d9482b;--e:#e59a10;--t:#2f7fc1;--o:#4f9a3d;--m:#8b8f1f;--n:#1f9a8a;--h:#cc3d86;--g:#7456c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #111;outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
header h1{margin:0;font:700 1.5rem Georgia,serif;letter-spacing:.5px}
header h1 span{font:400 .95rem "Trebuchet MS",sans-serif;opacity:.8;margin-left:8px}
#hud{display:flex;gap:10px;align-items:center}
#hud span{background:#ffffff1f;border-radius:20px;padding:3px 14px;font-size:.95rem}
#hud .pts{background:#fff;color:var(--ink);font-weight:700}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h2{font:700 1.5rem Georgia,serif;margin:0 0 6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.muted{color:var(--mute)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.mode{text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px;display:block}
.mode:hover{background:#f3f8fb}
.mode b{display:block;font:700 1.2rem Georgia,serif;margin-bottom:4px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tw{overflow-x:auto;padding:4px 0}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:4px;min-width:720px}
.tile{--c:#8d99a8;background:color-mix(in srgb,var(--c) 18%,#fff);border:2px solid var(--c);border-radius:6px;aspect-ratio:1;padding:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;line-height:1.05}
.tile small{font:600 10px "Trebuchet MS",sans-serif}
.tile b{font-size:1.1rem}
.tile:hover{transform:scale(1.08)}
.tile.dim{opacity:.22}
.tile.miss{opacity:.35}.tile.miss b{text-decoration:line-through}
.tile.hit{outline:4px solid var(--good);outline-offset:1px}
.c-a{--c:var(--a)}.c-e{--c:var(--e)}.c-t{--c:var(--t)}.c-o{--c:var(--o)}.c-m{--c:var(--m)}.c-n{--c:var(--n)}.c-h{--c:var(--h)}.c-g{--c:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{--c:#8d99a8;background:color-mix(in srgb,var(--c) 18%,#fff);border:2px solid var(--c);border-radius:20px;padding:3px 12px;font-size:.9rem}
.chip.on{background:var(--c);color:#fff}
.clue{border-left:6px solid var(--accent);background:#eef7f8;padding:8px 14px;margin:8px 0;border-radius:0 8px 8px 0}
.fb{border-left:6px solid var(--mute);background:#fff;padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.fb.good{border-color:var(--good);background:#edf8f1}.fb.bad{border-color:var(--bad);background:#fdf0ee}
.card{text-align:center}
.card .sym{font:700 4.5rem/1 Georgia,serif}
.card .nm{font:700 1.4rem Georgia,serif}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.ch{--c:#8d99a8;background:color-mix(in srgb,var(--c) 16%,#fff);border:2px solid var(--c);border-radius:8px;padding:10px;font-weight:700;text-align:left}
.ch:disabled{cursor:default}
.ch.ok{outline:4px solid var(--good)}.ch.no{opacity:.45;text-decoration:line-through}
.qopts{display:grid;gap:10px;margin-top:12px}
.qopts .ch{--c:#5f7184}
.badge{display:block;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--mute)}.badge.ok{color:var(--good)}
.big{font:700 2.4rem Georgia,serif}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .1s}}
</style>
</head>
<body>
<header>
  <h1>Element Lab<span>Periodic Table Challenge</span></h1>
  <div id="hud" aria-live="polite"></div>
</header>
<main id="app"></main>

<script>
/* ---------- Data (elements 1-36, periods 1-4) ---------- */
const CATS={
 a:["Alkali metals","Group 1 (not hydrogen). Soft, shiny, and extremely reactive. Each has 1 valence electron."],
 e:["Alkaline earth metals","Group 2. Shiny and fairly reactive. Each has 2 valence electrons."],
 t:["Transition metals","Groups 3 to 12. Hard, shiny, and good at conducting heat and electricity."],
 o:["Other metals","Metals on the right side of the table. Softer than transition metals, but still good conductors."],
 m:["Metalloids","Found along the staircase line. They have some properties of metals and some of nonmetals."],
 n:["Other nonmetals","Nonmetals that are not halogens or noble gases, such as carbon, nitrogen, and oxygen. Usually dull, poor conductors, and brittle if solid."],
 h:["Halogens","Group 17. Very reactive nonmetals with 7 valence electrons. They form salts with metals."],
 g:["Noble gases","Group 18. Nonmetal gases that almost never react because their outer shell is full."]
};
const RAW=`1|H|Hydrogen|1.0|n|gas|I am the lightest element, and stars burn me for fuel.
2|He|Helium|4.0|g|gas|I make balloons float and voices squeaky.
3|Li|Lithium|6.9|a|solid|I power the rechargeable batteries in phones and laptops.
4|Be|Beryllium|9.0|e|solid|I am found in the gemstone emerald.
5|B|Boron|10.8|m|solid|I help make heat-resistant lab glass.
6|C|Carbon|12.0|n|solid|Diamonds and pencil lead are both made of me, and all living things contain me.
7|N|Nitrogen|14.0|n|gas|I make up about 78% of the air you breathe.
8|O|Oxygen|16.0|n|gas|You need me to breathe, and I make up about 21% of air.
9|F|Fluorine|19.0|h|gas|I am added to toothpaste to help prevent cavities.
10|Ne|Neon|20.2|g|gas|I glow reddish-orange inside bright signs.
11|Na|Sodium|23.0|a|solid|I fizz wildly in water, but with chlorine I make table salt.
12|Mg|Magnesium|24.3|e|solid|I burn with a blinding white flame and help plants make chlorophyll.
13|Al|Aluminum|27.0|o|solid|I am the light, shiny metal in soda cans and foil.
14|Si|Silicon|28.1|m|solid|I am the main material in computer chips.
15|P|Phosphorus|31.0|n|solid|I am found in matches, bones, and DNA.
16|S|Sulfur|32.1|n|solid|I am yellow, and some of my compounds smell like rotten eggs.
17|Cl|Chlorine|35.5|h|gas|I keep swimming pools clean by killing germs.
18|Ar|Argon|39.9|g|gas|I fill light bulbs because I do not react with the hot filament.
19|K|Potassium|39.1|a|solid|Bananas are famous for containing me.
20|Ca|Calcium|40.1|e|solid|I build strong bones and teeth.
21|Sc|Scandium|45.0|t|solid|I am used in stadium lights and lightweight sports equipment.
22|Ti|Titanium|47.9|t|solid|I am as strong as steel but much lighter, so I am used in airplanes and hip replacements.
23|V|Vanadium|50.9|t|solid|I make steel tough, so I am used in wrenches and tools.
24|Cr|Chromium|52.0|t|solid|I give car bumpers their mirror-like shine.
25|Mn|Manganese|54.9|t|solid|I make steel hard enough for railroad tracks.
26|Fe|Iron|55.8|t|solid|I am the main metal in steel, and I carry oxygen in your blood.
27|Co|Cobalt|58.9|t|solid|I give glass and pottery a deep blue color.
28|Ni|Nickel|58.7|t|solid|I am in the U.S. five-cent coin, and I am magnetic.
29|Cu|Copper|63.5|t|solid|I make electrical wires because I conduct electricity so well.
30|Zn|Zinc|65.4|t|solid|I coat steel to stop rust, as on galvanized buckets.
31|Ga|Gallium|69.7|o|solid|I melt in your hand because my melting point is only about 30 °C.
32|Ge|Germanium|72.6|m|solid|I am used in fiber-optic cables and night-vision lenses.
33|As|Arsenic|74.9|m|solid|I am a poisonous metalloid.
34|Se|Selenium|79.0|n|solid|You need tiny amounts of me, and Brazil nuts contain a lot.
35|Br|Bromine|79.9|h|liquid|I am a smelly, reddish-brown liquid at room temperature.
36|Kr|Krypton|83.8|g|gas|Superman's home planet shares my name, but I am a real noble gas.`;
const EL=RAW.split("\n").map(l=>{
  const [n,s,name,ms,c,st,f]=l.split("|"),N=+n;
  let g,p;
  if(N<=2){p=1;g=N==1?1:18}
  else if(N<=10){p=2;g=N<=4?N-2:N+8}
  else if(N<=18){p=3;g=N<=12?N-10:N}
  else{p=4;g=N-18}
  return {n:N,s,name,ms,c,st,f,g,p};
});
const main=e=>e.n!==1&&(e.g<=2||e.g>=13);
const val=e=>e.n===2?2:(e.g<=2?e.g:e.g-10);

/* ---------- Helpers ---------- */
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sample=(a,k)=>shuffle(a).slice(0,k);
const RANKS=[[0,"Lab Rookie"],[60,"Atom Apprentice"],[150,"Element Explorer"],[280,"Periodic Pro"],[450,"Master Chemist"]];
const PASS=0.6,need=t=>Math.ceil(PASS*t-1e-9);
const fresh=()=>({score:0,done:{},bestPct:{},tries:{},seen:{}});
let S=fresh(),V={};
try{Object.assign(S,JSON.parse(localStorage.getItem("elstate")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("elstate",JSON.stringify(S))}catch(e){}}
const goal=()=>`Goal: ${need(V.total)} of ${V.total}`;
/* Pick k items, favoring ones this student has not seen yet, so every attempt is different */
function draw(key,pool,k,id){
  const seen=new Set(S.seen[key]||[]);
  let out=shuffle(pool.filter(x=>!seen.has(id(x)))).slice(0,k);
  if(out.length<k){const have=new Set(out.map(id));out=out.concat(shuffle(pool.filter(x=>!have.has(id(x)))).slice(0,k-out.length));S.seen[key]=out.map(id)}
  else S.seen[key]=[...seen,...out.map(id)];
  save();return out;
}
function rank(s){let r=RANKS[0],nx=null;RANKS.forEach((x,i)=>{if(s>=x[0]){r=x;nx=RANKS[i+1]||null}});return {name:r[1],nx}}
function hud(){document.getElementById("hud").innerHTML=`<span>${rank(S.score).name}</span><span class="pts">${S.score} points</span>`}
function tableHTML(color){
  return `<div class="tw"><div class="pt" role="group" aria-label="Periodic table, periods 1 to 4">`+
  EL.map(e=>`<button class="tile ${color?"c-"+e.c:""}" data-n="${e.n}" data-c="${e.c}" style="grid-column:${e.g};grid-row:${e.p}" aria-label="${e.name}"><small>${e.n}</small><b>${e.s}</b></button>`).join("")+`</div></div>`;
}
function award(ok){
  if(!ok){V.streak=0;return 0}
  V.streak++;const p=10+Math.min(V.streak-1,5)*2;V.pts+=p;V.credit++;S.score+=p;return p;
}
function nextBtn(){return `<button class="btn" id="nx" data-next="1">${V.i+1>=V.total?"See results":"Next"}</button>`}
function focusNext(){const b=document.getElementById("nx");if(b)b.focus({preventScroll:false})}

/* ---------- Home ---------- */
function badge(k){const b=S.bestPct[k];
  return S.done[k]?`<span class="badge ok">&#10003; Completed. Best: ${b}%</span>`:S.tries[k]?`<span class="badge">Not complete yet. Best: ${b}%. Score 60% to finish.</span>`:`<span class="badge">Score 60% or better to complete.</span>`}
function home(){
  V={};hud();
  const r=rank(S.score),all=["det","sort","quiz"].every(k=>S.done[k]);
  app.innerHTML=`
  <h2>Choose your challenge</h2>
  <p class="muted">Complete each challenge by scoring at least 60%. Every attempt gives you a new set of questions, so you can replay to improve. Points add up as you play.${r.nx?` Next rank, <b>${r.nx[1]}</b>, at ${r.nx[0]} points.`:" You reached the top rank!"}</p>
  ${all?`<div class="fb good"><b>Mission complete!</b> You finished all three challenges. Show this screen to your teacher, then keep playing to rank up.</div>`:""}
  <div class="modes">
   <button class="mode" data-go="learn"><b>Study the Table</b>Explore every element and see how the 8 categories are arranged. Start here!</button>
   <button class="mode" data-go="det"><b>Element Detective</b>Read the clues and click the mystery element. Fewer clues means more points.${badge("det")}</button>
   <button class="mode" data-go="sort"><b>Sort It Out</b>Place elements in the right category, and find which elements belong to a category.${badge("sort")}</button>
   <button class="mode" data-go="quiz"><b>Brain Buster</b>Answer questions about groups, periods, protons, valence electrons, and more.${badge("quiz")}</button>
  </div>
  <div class="panel muted">This game covers the first 36 elements (periods 1 to 4). If a challenge feels hard, review in <b>Study the Table</b> first. <button class="btn alt" data-go="reset" style="padding:4px 12px;margin-left:8px">Reset my progress</button></div>`;
}

/* ---------- Study ---------- */
function learn(){
  V={onTile:showEl,onCat:showCat};
  app.innerHTML=`<div class="bar"><h2>Study the Table</h2><button class="btn alt" data-go="home">Back to menu</button></div>
  <p class="muted">Click a category to highlight it, or click any element to see its facts.</p>
  <div class="chips">${Object.keys(CATS).map(k=>`<button class="chip c-${k}" data-cat="${k}">${CATS[k][0]}</button>`).join("")}</div>
  ${tableHTML(true)}
  <div class="panel" id="info" aria-live="polite"><p class="muted" style="margin:0">Columns are called <b>groups</b>. Rows are called <b>periods</b>. Elements in the same group act alike. Look for the metalloid "staircase" that separates metals from nonmetals. Halogens and noble gases are nonmetals too, but they get their own categories.</p></div>`;
}
function showEl(n){
  const e=EL[n-1];document.querySelectorAll(".tile").forEach(t=>t.classList.remove("dim"));
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  document.getElementById("info").innerHTML=`<div class="big">${e.s} <span style="font-size:1.4rem">${e.name}</span></div>
  <div class="info"><div><b>Atomic number:</b> ${e.n} (that many protons)</div><div><b>Atomic mass:</b> ${e.ms}</div><div><b>Group:</b> ${e.g} &nbsp; <b>Period:</b> ${e.p}</div><div><b>State at room temp:</b> ${e.st}</div><div><b>Category:</b> ${CATS[e.c][0]}</div>${main(e)?`<div><b>Valence electrons:</b> ${val(e)}</div>`:""}</div>
  <p style="margin:8px 0 0">${e.f}</p>`;
}
function showCat(k){
  document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("dim",t.dataset.c!==k));
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.cat===k));
  document.getElementById("info").innerHTML=`<div class="big" style="font-size:1.6rem">${CATS[k][0]}</div><p style="margin:6px 0 0">${CATS[k][1]}</p>`;
}

/* ---------- Element Detective ---------- */
const DP=[10,7,4,2];
function detStart(){V={kind:"det",i:0,total:8,pts:0,right:0,streak:0,list:draw("det",EL,8,e=>e.n),credit:0,onTile:detGuess,next:detNext};detRound()}
function detRound(){V.clue=1;V.wrong=[];V.done=false;V.msg="";detDraw()}
function clues(e){return [
 `<b>Clue 1:</b> ${e.f} At room temperature I am a ${e.st}.`,
 `<b>Clue 2:</b> My category is <b>${CATS[e.c][0].toLowerCase()}</b>.`,
 `<b>Clue 3:</b> I am in <b>period ${e.p}</b> and <b>group ${e.g}</b>.`,
 `<b>Clue 4:</b> My atomic number is <b>${e.n}</b>, so I have ${e.n} proton${e.n>1?"s":""}.`]}
function detDraw(){
  const e=V.list[V.i],cl=clues(e);
  app.innerHTML=`<div class="bar"><h2>Element Detective</h2><span class="muted">Mystery ${V.i+1} of ${V.total} &nbsp; ${goal()}</span></div>
  <p class="muted">Click the tile you think is the mystery element. Each wrong guess reveals another clue. Fewer clues means more points (${DP.join(", ")}). Solving a mystery only after the last clue counts as half credit.</p>
  <div class="panel">${cl.slice(0,V.clue).map(c=>`<div class="clue">${c}</div>`).join("")}</div>
  ${tableHTML(false)}
  <div aria-live="polite">${V.msg}</div>${V.done?nextBtn():""}`;
  V.wrong.forEach(n=>{const t=app.querySelector(`[data-n="${n}"]`);t.classList.add("miss");t.disabled=true});
  if(V.done){app.querySelectorAll(".tile").forEach(t=>t.disabled=true);const t=app.querySelector(`[data-n="${e.n}"]`);t.classList.add("c-"+e.c,"hit");focusNext()}
}
function detGuess(n){
  if(V.done)return;const e=V.list[V.i];
  if(n===e.n){
    const p=DP[V.clue-1],full=V.clue<=3;V.pts+=p;V.credit+=full?1:.5;S.score+=p;V.done=true;
    V.msg=`<div class="fb good"><b>Yes! It is ${e.name} (${e.s}). +${p} points.${full?"":" Half credit, since you needed the last clue."}</b><br>${CATS[e.c][0]}: ${CATS[e.c][1]}</div>`;
  }else{
    V.wrong.push(n);
    if(V.clue<4){V.clue++;V.msg=`<div class="fb bad">Not ${EL[n-1].name}. Here is a new clue.</div>`}
    else{V.done=true;V.msg=`<div class="fb bad"><b>The answer was ${e.name} (${e.s}).</b><br>${CATS[e.c][0]}: ${CATS[e.c][1]}</div>`}
  }
  hud();detDraw();
}
function detNext(){V.i++;V.i>=V.total?results("Element Detective"):detRound()}

/* ---------- Sort It Out ---------- */
function sortStart(){
  V={kind:"sort",i:0,total:10,pts:0,credit:0,right:0,streak:0,onCat:sortPick,onOpt:sortFind,next:sortNext,done:false,msg:"",
   list:draw("sort",EL,10,e=>e.n).map(e=>({e,fmt:Math.random()<.4?"find":"cat",o:shuffle([e,...sample(EL.filter(x=>x.c!==e.c),3)])}))};
  sortDraw();
}
function sortDraw(){
  const it=V.list[V.i],e=it.e;let body;
  if(it.fmt==="cat")body=`<p class="muted">Which category does this element belong to?</p>
  <div class="panel card"><div class="sym">${e.s}</div><div class="nm">${e.name}</div>
   <div class="facts"><span><b>Atomic number:</b> ${e.n}</span><span><b>Mass:</b> ${e.ms}</span><span><b>State:</b> ${e.st}</span><span><b>Group:</b> ${e.g}</span><span><b>Period:</b> ${e.p}</span></div></div>
  <div class="choices">${Object.keys(CATS).map(k=>`<button class="ch c-${k}" data-cat="${k}" ${V.done?"disabled":""}>${CATS[k][0]}</button>`).join("")}</div>`;
  else body=`<p class="muted">Pick the element that belongs to this category.</p>
  <div class="panel"><div style="font:700 1.25rem Georgia,serif">Which of these is one of the ${CATS[e.c][0].toLowerCase()}?</div>
  <div class="qopts">${it.o.map((x,i)=>`<button class="ch" data-opt="${i}" ${V.done?"disabled":""}>${x.name} (${x.s})</button>`).join("")}</div></div>`;
  app.innerHTML=`<div class="bar"><h2>Sort It Out</h2><span class="muted">Question ${V.i+1} of ${V.total} &nbsp; Streak: ${V.streak} &nbsp; ${goal()}</span></div>${body}
  <div aria-live="polite">${V.msg}</div>${V.done?nextBtn():""}`;
  if(V.done){
    if(it.fmt==="cat"){app.querySelector(`.ch[data-cat="${e.c}"]`).classList.add("ok");if(V.picked!==e.c)app.querySelector(`.ch[data-cat="${V.picked}"]`).classList.add("no")}
    else app.querySelectorAll(".ch").forEach((b,i)=>{if(it.o[i]===e)b.classList.add("ok");else if(i===V.picked)b.classList.add("no")});
    focusNext();
  }
}
function sortPick(k){if(V.done)return;V.picked=k;sortEnd(k===V.list[V.i].e.c)}
function sortFind(i){if(V.done)return;const it=V.list[V.i];V.picked=+i;sortEnd(it.o[i]===it.e)}
function sortEnd(ok){
  const e=V.list[V.i].e,p=award(ok);V.done=true;
  V.msg=ok?`<div class="fb good"><b>Correct! +${p} points.</b><br>${e.name} is one of the ${CATS[e.c][0].toLowerCase()}. ${CATS[e.c][1]}</div>`
   :`<div class="fb bad"><b>Not quite.</b> ${e.name} belongs to the <b>${CATS[e.c][0].toLowerCase()}</b>.<br>${CATS[e.c][1]}</div>`;
  hud();sortDraw();
}
function sortNext(){V.i++;if(V.i>=V.total)return results("Sort It Out");V.done=false;V.msg="";sortDraw()}

/* ---------- Brain Buster ---------- */
const STAT=[
["The periodic table is arranged by increasing…",["Atomic number","Alphabet order","Date of discovery","Color"],"Atomic number, which is the number of protons in each atom."],
["What is a horizontal row on the periodic table called?",["A period","A group","A block","A family tree"],"Rows are periods. Columns are groups."],
["Elements in the same group (column) have…",["Similar chemical properties","The same atomic mass","The same number of protons","The same state of matter"],"They have the same number of valence electrons, so they react in similar ways."],
["What does the atomic number tell you?",["The number of protons in the nucleus","The number of neutrons","How many shells the atom has","How heavy the atom is"],"The atomic number is the number of protons. It identifies the element."],
["Why are noble gases so unreactive?",["Their outer electron shell is full","They have no electrons","They are all liquids","They are very heavy"],"A full outer shell means they have no need to gain, lose, or share electrons."],
["Which properties are typical of metals?",["Shiny and good conductors of electricity","Dull and brittle","Poor conductors of heat","Gases at room temperature"],"Metals are shiny, ductile, malleable, and good conductors."],
["Where are metalloids found on the table?",["Along the staircase between metals and nonmetals","In the far left column","In the top row","At the very bottom"],"Metalloids sit along the staircase line and act partly like metals and partly like nonmetals."],
["What are valence electrons?",["Electrons in the outermost shell","Particles in the nucleus","Protons","Neutrons"],"Valence electrons are in the outer shell and decide how an atom bonds."],
["A material that can be pulled into a thin wire is…",["Ductile","Brittle","Insulating","Radioactive"],"Ductile means it can be stretched into wires. Malleable means it can be hammered flat."],
["Which group has the most reactive metals?",["Alkali metals (Group 1)","Noble gases (Group 18)","Metalloids","Transition metals"],"Alkali metals have 1 valence electron that they lose very easily."],
["Which part of the table holds most of the nonmetals?",["The right side","The left side","The center","The bottom row"],"Metals fill the left and center. Nonmetals are mostly on the right (plus hydrogen)."],
["What do the elements in group 18 have in common?",["They are unreactive gases","They are soft, reactive metals","They are all liquids","They are metalloids"],"Group 18 is the noble gases, which almost never react."],
["Which is a property of nonmetals?",["Poor conductors of electricity","Always shiny","Easy to hammer into sheets","Always solid"],"Most nonmetals are dull and do not conduct electricity well."],
["Why are metalloids useful in electronics?",["They conduct better than nonmetals but not as well as metals","They never react","They are all gases","They are the lightest elements"],"Metalloids such as silicon can be controlled to carry electricity, which makes them perfect for computer chips."],
["Moving left to right across a period, the atomic number…",["Increases by one each step","Decreases by one each step","Stays the same","Doubles each step"],"Each element has one more proton than the element before it."],
["An atom has the same number of protons and electrons when it is…",["Neutral, with no charge","A positive ion","A negative ion","Radioactive"],"Positive protons and negative electrons cancel out in a neutral atom."],
["The halogens (Group 17) are known for…",["Reacting strongly with metals to form salts","Never reacting","Being shiny solids","Being very soft"],"Halogens have 7 valence electrons and eagerly gain one more."],
["Which group would react most like sodium?",["Group 1","Group 17","Group 18","Group 13"],"Sodium is in Group 1, so other Group 1 elements react in similar ways."],
["Which statement about the periodic table is true?",["Each element has its own unique atomic number","Two elements can share an atomic number","Elements are listed alphabetically","All elements are gases"],"The atomic number (number of protons) identifies the element."],
["An element with 8 valence electrons would most likely be…",["A noble gas","An alkali metal","A transition metal","A metalloid"],"A full outer shell makes noble gases unreactive."],
["What is the main difference between a group and a period?",["Groups are columns, periods are rows","Groups are rows, periods are columns","Both are columns","Both are rows"],"Remember: periods go across (like a sentence), groups go down."]
];
const GEN=[
 ()=>{const e=pick(EL),o=[e.n-3,e.n-2,e.n-1,e.n+1,e.n+2,e.n+3].filter(x=>x>0);
  return mk(`How many protons does an atom of ${e.name} have?`,String(e.n),sample(o,3).map(String),`${e.name} has atomic number ${e.n}, so it has ${e.n} proton${e.n>1?"s":""}.`)},
 ()=>{const e=pick(EL),o=[...new Set(EL.map(x=>x.g))].filter(x=>x!==e.g);
  return mk(`Which group (column) is ${e.name} in?`,String(e.g),sample(o,3).map(String),`${e.name} is in group ${e.g}, period ${e.p}.`)},
 ()=>{const e=pick(EL);
  return mk(`Which period (row) is ${e.name} in?`,String(e.p),[1,2,3,4].filter(x=>x!==e.p).map(String),`${e.name} is in period ${e.p}, group ${e.g}.`)},
 ()=>{const e=pick(EL.filter(main));
  return mk(`How many valence electrons does ${e.name} have?`,String(val(e)),sample([1,2,3,4,5,6,7,8].filter(x=>x!==val(e)),3).map(String),`${e.name} is in group ${e.g}, so it has ${val(e)} valence electrons.`)},
 ()=>{const e=pick(EL.filter(main)),mate=pick(EL.filter(x=>main(x)&&x.g===e.g&&x!==e));
  return mk(`Which element is in the same group as ${e.name}?`,mate.name,sample(EL.filter(x=>main(x)&&x.g!==e.g),3).map(x=>x.name),`${e.name} and ${mate.name} are both in group ${e.g}, so they have similar properties.`)},
 ()=>{const k=pick(Object.keys(CATS)),c=pick(EL.filter(x=>x.c===k));
  return mk(`Which element belongs to the ${CATS[k][0].toLowerCase()}?`,c.name,sample(EL.filter(x=>x.c!==k),3).map(x=>x.name),`${c.name} is one of the ${CATS[k][0].toLowerCase()}. ${CATS[k][1]}`)},
 ()=>{const e=pick(EL);return mk(`Which element has the atomic number ${e.n}?`,e.name,sample(EL.filter(x=>x!==e),3).map(x=>x.name),`${e.name} has ${e.n} protons, so its atomic number is ${e.n}.`)},
 ()=>{const e=pick(EL);return mk(`At room temperature, what state of matter is ${e.name}?`,e.st,["solid","liquid","gas","plasma"].filter(x=>x!==e.st).slice(0,3),`${e.name} is a ${e.st} at room temperature.`)}
];
function mk(q,a,d,w){return {q,a,w,o:shuffle([a,...d])}}
function quizStart(){
  const qs=draw("quizS",STAT,5,s=>s[0]).map(s=>mk(s[0],s[1][0],s[1].slice(1),s[2]));
  const seen=new Set(S.seen.quizG||[]),cur=new Set(qs.map(x=>x.q));let n=0;
  while(qs.length<12&&n++<600){const q=pick(GEN)();if(!cur.has(q.q)&&(!seen.has(q.q)||n>400)){cur.add(q.q);qs.push(q)}}
  S.seen.quizG=[...seen,...qs.slice(5).map(q=>q.q)].slice(-90);save();
  V={kind:"quiz",i:0,total:12,pts:0,credit:0,right:0,streak:0,list:shuffle(qs),onOpt:quizPick,next:quizNext,done:false,msg:""};quizDraw();
}
function quizDraw(){
  const q=V.list[V.i];
  app.innerHTML=`<div class="bar"><h2>Brain Buster</h2><span class="muted">Question ${V.i+1} of ${V.total} &nbsp; Streak: ${V.streak} &nbsp; ${goal()}</span></div>
  <div class="panel"><div style="font:700 1.25rem Georgia,serif">${q.q}</div>
  <div class="qopts">${q.o.map((o,i)=>`<button class="ch" data-opt="${i}" ${V.done?"disabled":""}>${o}</button>`).join("")}</div></div>
  <div aria-live="polite">${V.msg}</div>${V.done?nextBtn():""}`;
  if(V.done){const bs=app.querySelectorAll(".ch");bs.forEach((b,i)=>{if(q.o[i]===q.a)b.classList.add("ok");else if(i===V.picked)b.classList.add("no")});focusNext()}
}
function quizPick(i){
  if(V.done)return;const q=V.list[V.i];V.picked=+i;V.done=true;const ok=q.o[i]===q.a,p=award(ok);
  V.msg=ok?`<div class="fb good"><b>Correct! +${p} points.</b><br>${q.w}</div>`:`<div class="fb bad"><b>Not quite. The answer is ${q.a}.</b><br>${q.w}</div>`;
  hud();quizDraw();
}
function quizNext(){V.i++;if(V.i>=V.total)return results("Brain Buster");V.done=false;V.msg="";quizDraw()}

/* ---------- Results ---------- */
function results(name){
  const k=V.kind,cr=V.credit,tot=V.total,pct=Math.round(cr/tot*100),pass=cr/tot>=PASS-1e-9,nd=need(tot);
  S.tries[k]=(S.tries[k]||0)+1;S.bestPct[k]=Math.max(S.bestPct[k]||0,pct);if(pass)S.done[k]=true;save();
  const all=["det","sort","quiz"].every(x=>S.done[x]),r=rank(S.score);
  V={};hud();
  app.innerHTML=`<h2>${name}: ${pass?"challenge complete!":"not complete yet"}</h2>
  <div class="panel card"><div class="big">${pct}%</div><p style="margin:0">You earned <b>${cr} of ${tot}</b>.</p>
  <div class="fb ${pass?"good":"bad"}" style="text-align:left">${pass?"You passed! Replay any time for a brand-new set of questions to improve your best score.":`You need at least <b>${nd} of ${tot}</b> (60%) to complete this challenge. Review in Study the Table, then try again. You will get new questions.`}</div>
  ${all&&pass?`<div class="fb good" style="text-align:left"><b>Mission complete!</b> You finished all three challenges.</div>`:""}
  <p><b>Total points:</b> ${S.score} &nbsp; <b>Rank:</b> ${r.name}${r.nx?` (next rank at ${r.nx[0]})`:""}</p></div>
  <button class="btn" data-go="${k}">${pass?"Play again with new questions":"Try again with new questions"}</button>
  ${pass?"":`<button class="btn alt" data-go="learn">Study the Table</button>`} <button class="btn alt" data-go="home">Back to menu</button>`;
}

/* ---------- Routing ---------- */
const GO={reset(){if(confirm('Erase all progress and points on this computer?')){S=fresh();save()}home()},home,learn,det:detStart,sort:sortStart,quiz:quizStart};
app.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.go)GO[d.go]();
  else if(d.n&&V.onTile)V.onTile(+d.n);
  else if(d.cat&&V.onCat)V.onCat(d.cat);
  else if(d.opt!==undefined&&V.onOpt)V.onOpt(d.opt);
  else if(d.next&&V.next)V.next();
});
home();
</script>
